[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlint"
version = "1.0.0"
description = "A polished JSON validator and formatter for the command line."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["json", "validator", "formatter", "cli"]

[project.scripts]
jlint = "jlint:main"